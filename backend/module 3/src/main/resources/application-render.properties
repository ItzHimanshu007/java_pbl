# Render terminates HTTPS at its proxy and forwards requests to this HTTP listener.
server.address=0.0.0.0
server.port=${PORT:10000}
server.forward-headers-strategy=native

# Fail configuration when the deployment database URL is absent; never fall back to localhost.
spring.datasource.url=${CP_DB_URL}
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.minimum-idle=1
