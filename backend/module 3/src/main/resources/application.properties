spring.application.name=CivicPulse
server.port=${PORT:8080}
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp
spring.datasource.url=${CP_DB_URL:jdbc:mysql://localhost:3306/civicpulse?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
spring.datasource.username=${CP_DB_USERNAME:civicpulse}
spring.datasource.password=${CP_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=8
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
server.error.include-message=never
server.error.include-stacktrace=never
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${CP_COOKIE_SECURE:true}
server.servlet.session.timeout=10m
civic.security.secret=${CP_JWT_SECRET:}
civic.security.issuer=civicpulse
civic.security.token-lifetime=30m
civic.security.secure-cookie=${CP_COOKIE_SECURE:true}
civic.security.allow-ephemeral-key=false
civic.bootstrap.email=${CP_ADMIN_EMAIL:}
civic.bootstrap.password=${CP_ADMIN_PASSWORD:}
civic.bootstrap.display-name=${CP_ADMIN_NAME:Administrator}

civic.geocoder.url=${CP_GEOCODER_URL:https://photon.komoot.io}
